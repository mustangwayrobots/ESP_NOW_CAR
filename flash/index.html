<!-- Version & Timestamp Badge Container -->
<div id="build-info-badge" class="build-badge">
  <span class="pulse-dot"></span>
  <span id="version-text">Checking build version...</span>
</div>

<style>
  .build-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--accent-blue, #38bdf8);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 1rem;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent-blue, #38bdf8);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-blue, #38bdf8);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--accent-blue, #38bdf8); }
    100% { transform: scale(0.95); opacity: 0.8; }
  }
</style>

<script>
  // Automatically fetch the last modified timestamp of the binary or manifest file
  async function updateBuildTimestamp() {
    const versionText = document.getElementById('version-text');
    try {
      // You can point this to manifest.json or your primary firmware binary file
      const response = await fetch('manifest.json', { method: 'HEAD' });
      if (response.ok) {
        const lastModified = response.headers.get('last-modified');
        if (lastModified) {
          const date = new Date(lastModified);
          const formattedDate = date.toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            year: 'numeric' 
          });
          const formattedTime = date.toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit' 
          });
          versionText.textContent = `Build: ${formattedDate} - ${formattedTime}`;
          return;
        }
      }
      versionText.textContent = 'Build: Live Version';
    } catch (err) {
      console.error('Could not fetch build timestamp', err);
      versionText.textContent = 'Build: Active';
    }
  }

  updateBuildTimestamp();
</script>
