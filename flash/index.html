<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firmware Flasher | Mustang Way Robots</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --btn-secondary-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header { text-align: center; margin-bottom: 2rem; max-width: 800px; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    p.subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.5rem; }

    .nav-bar { width: 100%; max-width: 600px; display: flex; justify-content: flex-start; margin-bottom: 1.5rem; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-decoration: none;
      background-color: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .flasher-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .instructions { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }

    .build-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hardware-group { margin-bottom: 1.5rem; text-align: left; }

    .hardware-group label {
      display: block;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
    }

    .hardware-select {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .flash-btn {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
    }

    footer { margin-top: auto; padding-top: 4rem; color: var(--text-muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Firmware Flasher</h1>
    <p class="subtitle">Direct Browser Microcontroller Flashing</p>
  </header>

  <div class="nav-bar">
    <a href="https://mustangwayrobots.github.io/" class="back-btn">
      ← Back to Main Portal
    </a>
  </div>

  <main class="flasher-card">
    <div id="build-info-badge" class="build-badge">
      <span>Select Hardware Version</span>
    </div>

    <!-- Hardware Version Selector Dropdown -->
    <div class="hardware-group">
      <label for="hardware-select">Robot Hardware Version:</label>
      <select id="hardware-select" class="hardware-select" onchange="updateManifest()">
        <option value="manifest_hardware_v1.json">Hardware Version V1 (Legacy)</option>
        <option value="manifest_hardware_v2.json" selected>Hardware Version V2 (Current)</option>
        <option value="manifest_hardware_v3.json">Hardware Version V3</option>
        <option value="manifest_hardware_v4.json">Hardware Version V4</option>
      </select>
    </div>

    <p class="instructions">
      Connect your robot board via USB, ensure you select your correct hardware version above, and click install.
    </p>

    <!-- ESP Web Tools Install Button Component -->
    <esp-web-install-button id="install-btn" manifest="manifest_hardware_v2.json">
      <button slot="activate" class="flash-btn">
        ⚡ Install Firmware
      </button>
    </esp-web-install-button>
  </main>

  <footer>
    &copy; Mustang Way Robots • Downers Grove South High School
  </footer>

  <script>
    function updateManifest() {
      const select = document.getElementById('hardware-select');
      const installButton = document.getElementById('install-btn');
      installButton.setAttribute('manifest', select.value);
    }
  </script>
</body>
</html>
