<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robotics Firmware Installer</title>
    
    <!-- Google Fonts: Explicitly load Orbitron with full weight and italic ranges -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Load official ESP Web Tools script -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    
    <style>
        /* Force Orbitron Italic globally across all elements */
        * {
            font-family: 'Orbitron', sans-serif !important;
            font-style: italic !important;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 85vh;
        }

        .top-nav {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .installer-card {
            background-color: #1e293b;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h1 {
            font-weight: 900;
            color: #38bdf8;
            font-size: 24px;
            margin: 10px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        p {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .status-badge {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .status-dot {
            height: 9px;
            width: 9px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Single, clean back link pointing directly to your absolute flash hub path -->
    <div class="top-nav">
        <a href="/flash/" class="back-link">← BACK TO PROJECT HUB</a>
    </div>

    <div class="installer-card">
        <div class="logo">🤖</div>
        <h1 id="project-title">LOADING PROJECT...</h1>
        <p>Connect your ESP32-C3 microcontroller via USB and click below to flash the firmware directly from your browser.</p>
        
        <div id="device-status" class="status-badge">
            <span id="status-dot" class="status-dot"></span><span id="status-text">NO HARDWARE DETECTED</span>
        </div>

        <div class="button-container">
            <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>
        </div>
    </div>

    <script>
        // Extract repo name for heading
        try {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length > 0) {
                let repoName = pathParts[pathParts.length - 1];
                repoName = repoName.replace(/[_]/g, ' ').replace(/[-]/g, ' ');
                document.getElementById('project-title').innerText = repoName;
            } else {
                document.getElementById('project-title').innerText = "ROBOTICS FIRMWARE";
            }
        } catch (e) {
            document.getElementById('project-title').innerText = "ROBOTICS FIRMWARE";
        }

        // Web Serial API hardware listener
        async function checkSerialSupport() {
            if (!navigator.serial) return;

            try {
                const ports = await navigator.serial.getPorts();
                if (ports.length > 0) updateConnectionState(true);
            } catch (err) {
                console.error(err);
            }

            navigator.serial.addEventListener('connect', () => updateConnectionState(true));
            navigator.serial.addEventListener('disconnect', () => updateConnectionState(false));
        }

        function updateConnectionState(isConnected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            if (isConnected) {
                dot.classList.add('connected');
                text.innerText = "ESP32-C3 READY (CONNECTED)";
            } else {
                dot.classList.remove('connected');
                text.innerText = "NO HARDWARE DETECTED";
            }
        }

        // Force Orbitron Italic inside the ESP Web Tools shadow DOM button
        function styleCustomButton() {
            const installBtn = document.querySelector('esp-web-install-button');
            if (installBtn && installBtn.shadowRoot) {
                const style = document.createElement('style');
                style.textContent = `
                    button, slot, ::slotted(*) {
                        font-family: 'Orbitron', sans-serif !important;
                        font-style: italic !important;
                        font-weight: 700 !important;
                        letter-spacing: 1px !important;
                    }
                `;
                installBtn.shadowRoot.appendChild(style);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkSerialSupport();
            setTimeout(styleCustomButton, 300);
        });
    </script>
</body>
</html>
