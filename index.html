<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robotics Firmware Installer</title>
    
    <!-- Google Fonts: Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Load official ESP Web Tools script -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    
    <style>
        /* Global font base */
        * {
            font-family: 'Orbitron', sans-serif !important;
            font-style: normal !important;
        }

        body {
            background-color: #050b14;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 85vh;
        }

        .top-nav {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1.5px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .installer-card {
            background-color: #0f172a;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 2px solid #1e293b;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* Explicit, heavy Orbitron styling for the repository title */
        h1 {
            font-family: 'Orbitron', sans-serif !important;
            font-weight: 900 !important;
            color: #38bdf8;
            font-size: 26px;
            margin: 10px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .status-badge {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="/flash/" class="back-link">← BACK TO PROJECT HUB</a>
    </div>

    <div class="installer-card">
        <div class="logo">🤖</div>
        <h1 id="project-title">LOADING PROJECT...</h1>
        <p>Connect your ESP32-C3 microcontroller via USB and click below to flash the firmware directly from your browser.</p>
        
        <div id="device-status" class="status-badge">
            <span id="status-dot" class="status-dot"></span><span id="status-text">NO HARDWARE DETECTED</span>
        </div>

        <div class="button-container">
            <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>
        </div>
    </div>

    <script>
        // Extract repo name for heading
        try {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length > 0) {
                let repoName = pathParts[pathParts.length - 1];
                repoName = repoName.replace(/[_]/g, ' ').replace(/[-]/g, ' ');
                document.getElementById('project-title').innerText = repoName;
            } else {
                document.getElementById('project-title').innerText = "ROBOTICS FIRMWARE";
            }
        } catch (e) {
            document.getElementById('project-title').innerText = "ROBOTICS FIRMWARE";
        }

        // Web Serial API hardware listener
        async function checkSerialSupport() {
            if (!navigator.serial) return;

            try {
                const ports = await navigator.serial.getPorts();
                if (ports.length > 0) updateConnectionState(true);
            } catch (err) {
                console.error(err);
            }

            navigator.serial.addEventListener('connect', () => updateConnectionState(true));
            navigator.serial.addEventListener('disconnect', () => updateConnectionState(false));
        }

        function updateConnectionState(isConnected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            if (isConnected) {
                dot.classList.add('connected');
                text.innerText = "ESP32-C3 READY (CONNECTED)";
            } else {
                dot.classList.remove('connected');
                text.innerText = "NO HARDWARE DETECTED";
            }
        }

        // Aggressive shadow DOM injector for the ESP Web Tools button
        const forceButtonFont = () => {
            const installBtn = document.querySelector('esp-web-install-button');
            if (installBtn && installBtn.shadowRoot) {
                const shadow = installBtn.shadowRoot;
                if (!shadow.querySelector('#orbitron-override')) {
                    const style = document.createElement('style');
                    style.id = 'orbitron-override';
                    style.textContent = `
                        button, slot, span, div, ::slotted(*) {
                            font-family: 'Orbitron', sans-serif !important;
                            font-weight: 700 !important;
                            letter-spacing: 1px !important;
                        }
                    `;
                    shadow.appendChild(style);
                }
            }
        };

        // Run repeatedly until the shadow root is caught and styled
        const fontInterval = setInterval(forceButtonFont, 50);
        setTimeout(() => clearInterval(fontInterval), 5000); // Clear after 5 seconds

        window.addEventListener('DOMContentLoaded', () => {
            checkSerialSupport();
        });
    </script>
</body>
</html>
