<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mustang Robotics - Installer</title>
    <!-- Load the official ESP Web Tools installer script component -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 50px; text-align: center; }
        .installer-card { background: #1e293b; max-width: 500px; margin: 40px auto; padding: 40px; border-radius: 16px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-top: 0; text-transform: uppercase; }
        p { color: #94a3b8; line-height: 1.6; }
        .button-container { display: flex; justify-content: center; margin-top: 30px; min-height: 50px; }
    </style>
</head>
<body>

    <div class="installer-card">
        <h1 id="project-title">🤖 MUSTANG ROBOTICS</h1>
        <p>Connect your ESP32-C3 via USB and click the installer button below to flash the firmware.</p>
        
        <div class="button-container">
            <!-- Official ESP Web Tools custom element pointing to your manifest -->
            <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>
        </div>
    </div>

</body>
</html>
