name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Compile and Generate Manifests for All Hardware Versions
        run: |
          mkdir -p ./flash
          
          DETECTED=$(grep -roh "HARDWARE_V[0-9]\+" . | sort -u || true)
          HARDWARES="HARDWARE_V1 HARDWARE_V2 $DETECTED"
          HARDWARES=$(echo $HARDWARES | tr ' ' '\n' | sort -u)

          echo "Compiling Hardware Variants:"
          echo "$HARDWARES"

          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            APP_BIN="firmware_${LOWER_HW}.bin"
            BOOT_BIN="bootloader_${LOWER_HW}.bin"
            PART_BIN="partitions_${LOWER_HW}.bin"
            BOOTAPP_BIN="boot_app0_${LOWER_HW}.bin"
            MANIFEST_NAME="manifest_${LOWER_HW}.json"
            
            echo "----------------------------------------"
            echo "Compiling for $HW..."
            echo "----------------------------------------"
            
            arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-property "build.extra_flags=-D$HW" --output-dir ./build_${LOWER_HW} .
            
            # Copy and rename individual binaries needed for non-destructive flashing
            find ./build_${LOWER_HW} -name "*.ino.bin" ! -name "*.merged.bin" -exec cp {} ./flash/$APP_BIN \;
            find ./build_${LOWER_HW} -name "*.bootloader.bin" -exec cp {} ./flash/$BOOT_BIN \;
            find ./build_${LOWER_HW} -name "*.partitions.bin" -exec cp {} ./flash/$PART_BIN \;
            find ./build_${LOWER_HW} -name "*.bin" | grep -E "boot_app0" | head -n 1 | xargs -I {} cp {} ./flash/$BOOTAPP_BIN || true
            
            # Fallback for boot_app0 if named differently by the core version
            if [ ! -f ./flash/$BOOTAPP_BIN ]; then
              find ~/.arduino15/packages/esp32/hardware/esp32/*/tools/sdk/esp32c3/bin/boot_app0.bin -exec cp {} ./flash/$BOOTAPP_BIN \; || true
            fi

            # Create matching manifest targeting correct ESP32-C3 standard flash offsets
            # Keeping new_install_prompt_erase: false preserves the NVS partition region
            jq -n \
              --arg name "ESP32-C3 Robot Firmware ($HW)" \
              --arg version "Build: $BUILD_DATE UTC" \
              --arg app "$APP_BIN" \
              --arg boot "$BOOT_BIN" \
              --arg parts "$PART_BIN" \
              '{
                name: $name,
                version: $version,
                home_assistant_domain: "esp_web_tools",
                new_install_prompt_erase: false,
                builds: [
                  {
                    chipFamily: "ESP32-C3",
                    parts: [
                      { path: $boot, offset: 0x0 },
                      { path: $parts, offset: 0x8000 },
                      { path: $app, offset: 0x10000 }
                    ]
                  }
                ]
              }' > ./flash/$MANIFEST_NAME
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
