name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Compile and Generate Manifests for All Hardware Versions
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p ./flash
          
          DETECTED=$(grep -roh "HARDWARE_V[0-9]\+" . | sort -u || true)
          HARDWARES="HARDWARE_V1 HARDWARE_V2 $DETECTED"
          HARDWARES=$(echo $HARDWARES | tr ' ' '\n' | sort -u)

          echo "Compiling Hardware Variants:"
          echo "$HARDWARES"

          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            BIN_NAME="firmware_${LOWER_HW}.bin"
            MANIFEST_NAME="manifest_${LOWER_HW}.json"
            
            echo "----------------------------------------"
            echo "Compiling for $HW..."
            echo "----------------------------------------"
            
            arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-property "build.extra_flags=-D$HW" --output-dir ./build_${LOWER_HW} .
            
            # Copy merged binary into flash folder
            find ./build_${LOWER_HW} -name "*.ino.merged.bin" -exec cp {} ./flash/$BIN_NAME \;
            
            # Create manifest
            jq -n \
              --arg name "ESP32-C3 Robot Firmware ($HW)" \
              --arg version "Build: $BUILD_DATE UTC" \
              --arg bin "$BIN_NAME" \
              '{
                name: $name,
                version: $version,
                home_assistant_domain: "esp_web_tools",
                new_install_prompt_erase: true,
                builds: [
                  {
                    chipFamily: "ESP32-C3",
                    parts: [
                      { path: $bin, offset: 0 }
                    ]
                  }
                ]
              }' > ./flash/$MANIFEST_NAME
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
