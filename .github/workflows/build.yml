name: Compile and Deploy Firmware

# ===========================================================================
# Generic build for Mustang Way Robots ESP32-C3 projects.
# Copy this file unchanged into any project's .github/workflows/ folder,
# along with flash/index.html. It finds everything else by itself:
#   - the sketch: the .ino file whose name matches its folder
#   - the boards: every HARDWARE_Vx in that sketch's HardwareConfig.h
#                 (#if / #elif / #ifdef lines). No HardwareConfig.h, or no
#                 HARDWARE_Vx in it = one build with no board flag.
#   - libraries:  the repo's own libraries/ folder, if it has one. Each project
#                 carries the libraries it needs; nothing is downloaded from elsewhere.
#
# The firmware is published as separate pieces (bootloader, partition table,
# boot_app0, app), each flashed at its own address, exactly like Arduino IDE.
# A single merged file would also overwrite the NVS area between them and
# wipe the saved pairing on every web flash.
# new_install_prompt_erase must stay true: ESP Web Tools then asks
# "Erase device?" with the box unchecked. If it is false, ESP Web Tools
# ALWAYS erases the whole chip (our firmware has no Improv Serial).
# ===========================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you re-run the build from the Actions tab

permissions:
  contents: write

# Shared settings. Keep CORE_VERSION and FQBN the same as Arduino IDE
# (core: Tools > Board > Boards Manager > esp32, board: MakerGO ESP32 C3
# SuperMini, which turns USB Serial on).
env:
  CORE_VERSION: "3.3.12"
  FQBN: "esp32:esp32:makergo_c3_supermini"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${CORE_VERSION}"

      - name: Compile, Generate Manifests, and Build Info
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # --- Find the sketch: the .ino whose file name matches its folder ---
          SKETCH_DIR=""
          while IFS= read -r INO; do
            DIR=$(dirname "$INO")
            if [ "$(basename "$INO" .ino)" = "$(basename "$(cd "$DIR" && pwd)")" ]; then
              SKETCH_DIR="$DIR"; break
            fi
          done < <(find . -name "*.ino" -not -path "./libraries/*" -not -path "./.git/*" | sort)
          if [ -z "$SKETCH_DIR" ]; then
            echo "ERROR: no sketch found (an .ino file named the same as its folder)"
            exit 1
          fi
          echo "Sketch folder: $SKETCH_DIR"

          # --- Find the boards in HardwareConfig.h ---
          HARDWARES=""
          if [ -f "$SKETCH_DIR/HardwareConfig.h" ]; then
            HARDWARES=$(grep -E '^\s*#\s*(if|elif|ifdef)\b' "$SKETCH_DIR/HardwareConfig.h" \
                        | grep -oE 'HARDWARE_V[0-9]+' | sort -u -V | tr '\n' ' ' || true)
          fi
          [ -z "$HARDWARES" ] && HARDWARES="DEFAULT"
          echo "Boards to build: $HARDWARES"

          # --- Optional repo-local libraries ---
          LIB_ARGS=()
          [ -d ./libraries ] && LIB_ARGS=(--libraries ./libraries) && echo "Using ./libraries"

          mkdir -p ./flash
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")
          COMMIT=$(git rev-parse --short HEAD)
          BOARDS_JSON="[]"

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            MANIFEST_NAME="manifest_${LOWER_HW}.json"
            BUILD_DIR="/tmp/build_${LOWER_HW}"     # outside the repo, so it is never published
            if [ "$HW" = "DEFAULT" ]; then
              LABEL="Standard board"
              FLAGS=()
            else
              LABEL="Hardware ${HW#HARDWARE_}"          # e.g. "Hardware V4"
              # compiler.*.extra_flags ADD -DHARDWARE_Vx on top of the board's
              # own settings (build.extra_flags would REPLACE them).
              FLAGS=(--build-property "compiler.cpp.extra_flags=-D$HW"
                     --build-property "compiler.c.extra_flags=-D$HW")
            fi

            echo "----------------------------------------"
            echo "Compiling $REPO_NAME for $LABEL..."
            echo "----------------------------------------"

            arduino-cli compile --fqbn "$FQBN" "${FLAGS[@]}" "${LIB_ARGS[@]}" \
              --build-path "$BUILD_DIR" "$SKETCH_DIR"

            # --- Firmware pieces and addresses, from the core's flash_args ---
            # (lines like "0x8000 Sketch.ino.partitions.bin")
            if [ ! -f "$BUILD_DIR/flash_args" ]; then
              echo "ERROR: no flash_args produced for $HW"
              exit 1
            fi
            PARTS_JSON="[]"
            while read -r OFFSET FILE; do
              case "$OFFSET" in 0x*) ;; *) continue ;; esac   # skip the settings line
              if [ ! -f "$BUILD_DIR/$FILE" ]; then
                echo "ERROR: $FILE listed in flash_args but not built for $HW"
                exit 1
              fi
              PART_NAME="${LOWER_HW}_$(echo "$FILE" | sed -E 's/^.*\.ino\.bin$/app.bin/; s/^.*\.ino\.//')"   # e.g. hardware_v2_bootloader.bin
              cp "$BUILD_DIR/$FILE" "./flash/$PART_NAME"
              echo "  $OFFSET  $PART_NAME"
              PARTS_JSON=$(echo "$PARTS_JSON" | jq --arg p "$PART_NAME" --argjson o "$((OFFSET))" \
                '. + [{path: $p, offset: $o}]')
            done < "$BUILD_DIR/flash_args"
            if [ "$(echo "$PARTS_JSON" | jq length)" -lt 2 ]; then
              echo "ERROR: firmware pieces missing for $HW"
              exit 1
            fi
            rm -rf "$BUILD_DIR"

            # ESP Web Tools manifest for this board
            jq -n \
              --arg name "$REPO_NAME ($LABEL)" \
              --arg version "Build $BUILD_DATE UTC ($COMMIT)" \
              --argjson parts "$PARTS_JSON" \
              '{
                name: $name,
                version: $version,
                home_assistant_domain: "esp_web_tools",
                new_install_prompt_erase: true,
                builds: [
                  { chipFamily: "ESP32-C3", parts: $parts }
                ]
              }' > "./flash/$MANIFEST_NAME"

            BOARDS_JSON=$(echo "$BOARDS_JSON" | jq \
              --arg id "$HW" --arg label "$LABEL" --arg manifest "$MANIFEST_NAME" \
              '. + [{id: $id, label: $label, manifest: $manifest}]')
          done

          # Everything the flasher page shows comes from this file
          jq -n \
            --arg repo "$REPO_NAME" \
            --arg repo_url "$REPO_URL" \
            --arg build_date "$BUILD_DATE" \
            --arg commit "$COMMIT" \
            --arg core "esp32 $CORE_VERSION" \
            --argjson boards "$BOARDS_JSON" \
            '{repo: $repo, repo_url: $repo_url, build_date: $build_date,
              commit: $commit, core: $core, boards: $boards}' > ./flash/build-info.json

          echo "build-info.json:"
          cat ./flash/build-info.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
