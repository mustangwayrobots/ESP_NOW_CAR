name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Core (ESP32)
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        run: |
          # Add any external libraries your project needs here, for example:
          # arduino-cli lib install "FastLED"

      - name: Compile Sketch
        run: |
          # Compiles the sketch and generates the binary outputs
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir ./build .

      - name: Prepare Files for Web Flasher
        run: |
          # Moves and renames the merged binary so manifest.json can read it
          cp ./build/*.ino.merged.bin ./firmware.bin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
