name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Compile, Generate Manifests, and Populate Flasher UI
        run: |
          mkdir -p ./flash
          
          # Detect hardware versions dynamically from source code
          DETECTED=$(grep -roh "HARDWARE_V[0-9]\+" . | sort -u || true)
          HARDWARES="HARDWARE_V1 HARDWARE_V2 $DETECTED"
          HARDWARES=$(echo $HARDWARES | tr ' ' '\n' | sort -u)

          echo "Compiling Hardware Variants:"
          echo "$HARDWARES"

          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")
          OPTIONS_HTML=""
          FIRST_MANIFEST=""

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            BIN_NAME="firmware_${LOWER_HW}.bin"
            MANIFEST_NAME="manifest_${LOWER_HW}.json"
            
            # Format clean option label (e.g., "Hardware Version V1")
            HW_LABEL=$(echo "$HW" | sed 's/_/ /g')
            
            echo "----------------------------------------"
            echo "Compiling for $HW..."
            echo "----------------------------------------"
            
            arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-property "build.extra_flags=-D$HW" --output-dir ./build_${LOWER_HW} .
            
            # Copy binary directly into the flash folder
            find ./build_${LOWER_HW} -name "*.ino.merged.bin" -exec cp {} ./flash/$BIN_NAME \;
            
            # Clean up build artifact folder
            rm -rf ./build_${LOWER_HW}
            
            # Create matching manifest inside flash folder
            jq -n \
              --arg name "ESP32-C3 Robot Firmware ($HW)" \
              --arg version "Build: $BUILD_DATE UTC" \
              --arg bin "$BIN_NAME" \
              '{
                name: $name,
                version: $version,
                home_assistant_domain: "esp_web_tools",
                new_install_prompt_erase: false,
                builds: [
                  {
                    chipFamily: "ESP32-C3",
                    parts: [
                      { path: $bin, offset: 0 }
                    ]
                  }
                ]
              }' > ./flash/$MANIFEST_NAME

            # Build dropdown option HTML dynamically
            if [ -z "$FIRST_MANIFEST" ]; then
              FIRST_MANIFEST="$MANIFEST_NAME"
              OPTIONS_HTML="${OPTIONS_HTML}        <option value=\"$MANIFEST_NAME\" selected>${HW_LABEL} (Current)</option>\n"
            else
              OPTIONS_HTML="${OPTIONS_HTML}        <option value=\"$MANIFEST_NAME\">${HW_LABEL}</option>\n"
            fi
          done

          # Automatically inject the generated options and default manifest into flash/index.html
          python3 -c "
          with open('flash/index.html', 'r') as f:
              content = f.read()
          content = content.replace('<!-- OPTIONS_INJECTED_BY_CI -->', '''${OPTIONS_HTML}''')
          content = content.replace('DEFAULT_MANIFEST_PLACEHOLDER', '${FIRST_MANIFEST}')
          with open('flash/index.html', 'w') as f:
              f.write(content)
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
