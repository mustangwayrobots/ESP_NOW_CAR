name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile Sketch
        run: |
          # Compiles using the ESP32-C3 generic target (fully compatible with Super Mini)
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir ./build .

      - name: Prepare Files for Web Flasher
        run: |
          cp ./build/*.ino.merged.bin ./firmware.bin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
