name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Auto-Detect Hardware Versions and Compile All Variants
        run: |
          mkdir -p ./flash
          
          # Strictly find hardware versions like HARDWARE_V1, HARDWARE_V2, HARDWARE_V3, etc.
          HARDWARES=$(grep -roh "HARDWARE_V[0-9]\+" . | sort -u || true)
          
          # Fallback to HARDWARE_V1 if no specific version tags are found yet
          if [ -z "$HARDWARES" ]; then
            HARDWARES="HARDWARE_V1"
          fi
          
          echo "Detected Hardware Variants:"
          echo "$HARDWARES"

          BUILDS_JSON="[]"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            BIN_NAME="firmware_${LOWER_HW}.bin"
            
            echo "----------------------------------------"
            echo "Compiling for $HW..."
            echo "----------------------------------------"
            
            # Compile sketch passing the dynamic hardware definition flag
            arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-property "build.extra_flags=-D$HW" --output-dir ./build_${LOWER_HW} .
            
            # Copy the merged binary to root directory
            find ./build_${LOWER_HW} -name "*.ino.merged.bin" -exec cp {} ./$BIN_NAME \;
            
            # Format display name for the web dropdown (e.g., "Board Version V1")
            DISPLAY_NAME="Board Version V${HW#HARDWARE_V}"

            # Append to manifest builds array
            BUILDS_JSON=$(echo "$BUILDS_JSON" | jq --arg path "../$BIN_NAME" --arg name "$DISPLAY_NAME" \
              '. + [{"chipFamily": "ESP32-C3", "name": $name, "parts": [{"path": $path, "offset": 0}]}]')
          done

          # Automatically generate the final flash/manifest.json file
          jq -n \
            --arg name "ESP32 Robot Firmware" \
            --arg version "Build: $BUILD_DATE UTC" \
            --argjson builds "$BUILDS_JSON" \
            '{
              name: $name,
              version: $version,
              home_assistant_domain: "esp_web_tools",
              new_install_prompt_erase: true,
              builds: $builds
            }' > ./flash/manifest.json

          echo "Generated manifest.json successfully:"
          cat ./flash/manifest.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
