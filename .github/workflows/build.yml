name: Compile and Deploy Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you re-run the build from the Actions tab

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Settings for this repo. Change these, not the steps below.
#   HARDWARES   : every board version to build, separated by spaces.
#                 The FIRST one is the version selected by default on the
#                 flasher page.
#   CORE_VERSION: Arduino-ESP32 core. Keep it the same as Arduino IDE
#                 (Tools > Board > Boards Manager > esp32).
#   FQBN        : board, same as Arduino IDE "MakerGO ESP32 C3 SuperMini",
#                 which turns USB Serial on.
# ---------------------------------------------------------------------------
env:
  HARDWARES: "HARDWARE_V2 HARDWARE_V3 HARDWARE_V4"
  CORE_VERSION: "3.3.12"
  FQBN: "esp32:esp32:makergo_c3_supermini"
  FIRMWARE_NAME: "RC Car Firmware"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI & Add ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${CORE_VERSION}"

      - name: Pull Central Custom Libraries
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mustangwayrobots/arduino-libraries.git /home/runner/Arduino/libraries

      - name: Compile, Generate Manifests, and Populate Flasher UI
        run: |
          mkdir -p ./flash

          echo "Compiling Hardware Variants: $HARDWARES"

          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M")
          OPTIONS_HTML=""
          FIRST_MANIFEST=""

          for HW in $HARDWARES; do
            LOWER_HW=$(echo "$HW" | tr '[:upper:]' '[:lower:]')
            BIN_NAME="firmware_${LOWER_HW}.bin"
            MANIFEST_NAME="manifest_${LOWER_HW}.json"

            # Clean option label, e.g. "HARDWARE V4"
            HW_LABEL=$(echo "$HW" | sed 's/_/ /g')

            echo "----------------------------------------"
            echo "Compiling for $HW..."
            echo "----------------------------------------"

            # compiler.*.extra_flags adds -DHARDWARE_Vx on top of the board's
            # own settings. (build.extra_flags would REPLACE them and turn
            # USB Serial off.)
            arduino-cli compile --fqbn "$FQBN" \
              --build-property "compiler.cpp.extra_flags=-D$HW" \
              --build-property "compiler.c.extra_flags=-D$HW" \
              --output-dir ./build_${LOWER_HW} .

            # Copy the merged binary into the flash folder; stop if it is missing
            MERGED=$(find ./build_${LOWER_HW} -name "*.ino.merged.bin" | head -n 1)
            if [ -z "$MERGED" ]; then
              echo "ERROR: no merged .bin produced for $HW"
              exit 1
            fi
            cp "$MERGED" ./flash/$BIN_NAME

            rm -rf ./build_${LOWER_HW}

            # Create matching manifest inside flash folder
            jq -n \
              --arg name "$FIRMWARE_NAME ($HW_LABEL)" \
              --arg version "Build: $BUILD_DATE UTC, core $CORE_VERSION" \
              --arg bin "$BIN_NAME" \
              '{
                name: $name,
                version: $version,
                home_assistant_domain: "esp_web_tools",
                new_install_prompt_erase: false,
                builds: [
                  {
                    chipFamily: "ESP32-C3",
                    parts: [
                      { path: $bin, offset: 0 }
                    ]
                  }
                ]
              }' > ./flash/$MANIFEST_NAME

            # Dropdown option; the first board in HARDWARES is pre-selected
            if [ -z "$FIRST_MANIFEST" ]; then
              FIRST_MANIFEST="$MANIFEST_NAME"
              OPTIONS_HTML="${OPTIONS_HTML}        <option value=\"$MANIFEST_NAME\" selected>${HW_LABEL}</option>\n"
            else
              OPTIONS_HTML="${OPTIONS_HTML}        <option value=\"$MANIFEST_NAME\">${HW_LABEL}</option>\n"
            fi
          done

          # Inject the generated options and default manifest into flash/index.html
          python3 -c "
          with open('flash/index.html', 'r') as f:
              content = f.read()
          content = content.replace('<!-- OPTIONS_INJECTED_BY_CI -->', '''${OPTIONS_HTML}''')
          content = content.replace('DEFAULT_MANIFEST_PLACEHOLDER', '${FIRST_MANIFEST}')
          with open('flash/index.html', 'w') as f:
              f.write(content)
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
